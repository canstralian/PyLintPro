name: Pylint Code Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pylint:
    name: Pylint Analysis
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint pylint-flask bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run Pylint on source code
        id: pylint
        run: |
          echo "## Pylint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Run Pylint with the project configuration
          pylint src/ scripts/ --rcfile=.pylintrc --output-format=colorized --exit-zero 2>&1 | tee pylint_output.txt
          
          # Extract score from output
          SCORE=$(grep -oP "Your code has been rated at \K[0-9.]+" pylint_output.txt || echo "0.00")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          
          # Add results to step summary
          echo "### Score: $SCORE/10" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat pylint_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          
          # Fail if score is below threshold (adjustable)
          MIN_SCORE=6.0
          if (( $(echo "$SCORE < $MIN_SCORE" | bc -l) )); then
            echo "::error::Pylint score $SCORE is below minimum threshold of $MIN_SCORE"
            exit 1
          fi
      
      - name: Run Pylint on app files
        run: |
          pylint app.py lint.py --rcfile=.pylintrc --exit-zero --output-format=colorized || true
      
      - name: Run Bandit security scan
        if: always()
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          bandit -r src/ scripts/ app.py lint.py -f txt --exit-zero 2>&1 | tee bandit_output.txt
          
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat bandit_output.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Pylint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pylint-results-${{ matrix.python-version }}
          path: |
            pylint_output.txt
            bandit_output.txt
          retention-days: 30

  security-check:
    name: Security Vulnerability Check
    runs-on: ubuntu-latest
    needs: pylint
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run Bandit security linter
        run: |
          echo "## Bandit Security Analysis" >> $GITHUB_STEP_SUMMARY
          bandit -r . -x ./.git,./.venv,./venv,./tests -f json -o bandit-report.json --exit-zero
          bandit -r . -x ./.git,./.venv,./venv,./tests -f txt 2>&1 | tee -a $GITHUB_STEP_SUMMARY
      
      - name: Check for known vulnerabilities in dependencies
        run: |
          echo "## Dependency Vulnerability Check" >> $GITHUB_STEP_SUMMARY
          pip-audit --format json --output pip-audit-report.json --ignore-vuln GHSA-2g68-c3qc-8985 || true
          pip-audit || true
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30
